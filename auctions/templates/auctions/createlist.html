{% extends "auctions/layout.html" %}

{% block body %}
    <h2 class="page-title mb-4">Create Listing</h2>
    <div class="row">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form action="{% url 'createlist' %}" method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="image">Image URL</label>
                            <input name="image" id="image" class="form-control" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input name="title" id="title" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea name="description" id="description" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="price">Starting price</label>
                            <input name="price" id="price" type="number" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category (optional)</label>
                            <input name="category" id="category" class="form-control">
                        </div>
                        <input type="submit" class="btn btn-primary btn-block" value="Create listing">
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
